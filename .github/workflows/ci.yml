name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Wipe lib/proto first so leftover generated files from removed .proto
      # sources fail the diff. compile:typescript does not regenerate these;
      # the image builds what is committed. grpc_tools_node_protoc comes from
      # node_modules, so the runner uses the lockfile-pinned version.
      - name: Proto drift
        run: rm -rf lib/proto && npm run proto && git add -A -- lib/proto && git diff --cached --exit-code -- lib/proto

      # The command the image builds with, rather than a rebuilt approximation
      # of it: parseGitCommit, swagger-jsdoc (failOnErrors over the @openapi
      # blocks, which tsc cannot see because they are comments), tsc with the
      # declaration emit tsconfig asks for, and postcompile. --noEmit would skip
      # the emit and with it every diagnostic that only appears while emitting.
      - name: Compile
        run: npm run compile:typescript

      - name: Type check tests
        run: npm run compile:typescript:test

      - name: Prettier
        run: npm run prettier:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit -- -w 2

  # No workspace-wide cargo test: the boltz-core and boltzr suites reach for
  # bitcoind on 127.0.0.1:18443 and sit in the same test targets as the plain
  # unit tests, so they cannot be split off (106 and 97 red without regtest).
  # They are blocked on the same version catch-up as the integration tests,
  # see #117. boltzr-cli has no such dependency and is tested below.
  rust:
    name: Rust
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get -y install protobuf-compiler libsqlite3-dev

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: 'npm'

      # boltzr-cli embeds the contract artifacts that ship with boltz-core
      - name: Install dependencies
        run: npm ci

      - name: Install Rust
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (boltzr-cli only)
        run: cargo test -p boltzr-cli
